# Spyro: Dawn of the Dragon Recomp - Recomp Settings
#
# The game reads this file when it starts, and writes it whenever you change something in
# the in-game Recomp Settings menu. To change a setting from outside the game: close the
# game, replace the text after "=" with one of the choices listed above it, save the file,
# start the game again. A line the game doesn't understand keeps that setting's default.
#
# Steam Deck / Linux, for now: change Resolution HERE, not in the game - changing it in the
# game can freeze the game.

[Recomp Settings]

# Resolution: 720p, 800p, 1080p, 1440p, 4K
# The size the game is drawn at (the original is 720p). Higher = sharper and slower.
resolution = 800p

# Aspect ratio: 16:9, 16:10
# 16:10 fills a 16:10 screen like the Steam Deck's; on a 16:9 screen use 16:9.
aspect_ratio = 16:10

# Renderer: plume - Vulkan
# Always plume on Vulkan on Linux.
renderer = plume - Vulkan

# Frame rate: 30 FPS, 60 FPS, 120 FPS, Unlimited
# The game's frame rate cap.
frame_rate = 60 FPS

# VSync: On, Off
# Waits for the screen's refresh: no tearing.
vsync = On

# Display mode: Windowed, Borderless, Fullscreen
# Windowed, Borderless (the whole screen) or exclusive Fullscreen.
display_mode = Borderless

# Motion blur: On, Off
# The game's blur when the camera moves fast.
motion_blur = On

# Anti-aliasing: Off, MSAA 2x, MSAA 4x, MSAA 8x
# Smoother edges (MSAA); costs speed.
msaa = Off

# Bloom: Original, Off
# The glow around bright things.
bloom = Original

# Draw distance: Original, Max
# Max draws far scenery further out than the original.
draw_distance = Original

# Lock-on camera: On, Off
# R3 locks the camera onto the nearest enemy.
lockon_camera = On

# Online co-op: Off, On - soon
# Not there yet.
online_coop = Off
